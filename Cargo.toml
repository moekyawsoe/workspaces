[package]
name = "workspace-manager"
version = "0.1.0"
edition = "2021"
description = "Cross-platform workspace file manager"

[dependencies]
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
rfd = "0.14"
notify = "6"
portable-pty = "0.8"
vte = "0.13"
unicode-width = "0.1"
parking_lot = "0.12"
libc = "0.2"
arboard = "3"
self_update = "0.39"
ureq = "2"
zip = "0.6"

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "0.28" }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.28", features = ["wgpu"] }

[target.'cfg(target_os = "linux")'.dependencies]
xdg = "2"

[build-dependencies]
winres = "0.1"


[package.metadata.deb]
name = "workspace-manager"
maintainer = "Developer"
copyright = "2026"
section = "utility"

[[bin]]
name = "workspace-manager"
path = "src/main.rs"
