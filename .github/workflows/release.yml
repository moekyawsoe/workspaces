name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          cat Cargo.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Create .deb package
        run: |
          APP_NAME="workspace-manager"
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_DIR="build/linux"
          DEB_DIR="$BUILD_DIR/$APP_NAME-$VERSION"

          rm -rf "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          cp target/release/$APP_NAME "$DEB_DIR/usr/bin/"
          cp logo.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/$APP_NAME.png"

          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: $APP_NAME
          Version: $VERSION
          Section: utility
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libxcb-render0, libxcb-shape0, libxcb-xfixes0
          Maintainer: Moe Kyaw Soe
          Description: Cross-platform workspace file manager
           A desktop application to manage .code-workspace files with GUI.
          EOF

          cat > "$DEB_DIR/usr/share/applications/$APP_NAME.desktop" << EOF
          [Desktop Entry]
          Name=Workspace Manager
          Comment=Manage your workspace files
          Exec=/usr/bin/$APP_NAME
          Icon=$APP_NAME
          Terminal=false
          Type=Application
          Categories=Utility;Development;
          EOF

          dpkg-deb --build "$DEB_DIR" "$BUILD_DIR/$APP_NAME-$VERSION-amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manager-linux
          path: build/linux/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml version
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace "^v",""
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$VERSION`"" | Set-Content Cargo.toml
          Get-Content Cargo.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Create .zip archive
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace "^v",""
          $BUILD_DIR = "build\windows"
          New-Item -ItemType Directory -Force -Path $BUILD_DIR
          Copy-Item "target\release\workspace-manager.exe" "$BUILD_DIR\workspace-manager.exe"
          Compress-Archive -Path "$BUILD_DIR\workspace-manager.exe" -DestinationPath "$BUILD_DIR\workspace-manager-$VERSION-windows.zip"

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manager-windows
          path: build/windows/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          cat Cargo.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Create .app bundle
        run: |
          APP_NAME="workspace-manager"
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_DIR="build/macos"
          APP_BUNDLE="$BUILD_DIR/Workspace Manager.app"

          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          cp "target/release/$APP_NAME" "$APP_BUNDLE/Contents/MacOS/"
          cp logo.png "$APP_BUNDLE/Contents/Resources/icon.png"

          cat > "$APP_BUNDLE/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Workspace Manager</string>
              <key>CFBundleDisplayName</key>
              <string>Workspace Manager</string>
              <key>CFBundleIdentifier</key>
              <string>com.workspacemanager.app</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>icon.png</string>
          </dict>
          </plist>
          EOF

      - name: Create .dmg
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_DIR="build/macos"
          DMG_FILE="$BUILD_DIR/Workspace-Manager-$VERSION.dmg"

          hdiutil create -volname "Workspace Manager" \
              -srcfolder "$BUILD_DIR/Workspace Manager.app" \
              -ov -format UDZO \
              "$DMG_FILE"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manager-macos
          path: build/macos/*.dmg

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/workspace-manager-linux/*.deb
            artifacts/workspace-manager-windows/*.zip
            artifacts/workspace-manager-macos/*.dmg
